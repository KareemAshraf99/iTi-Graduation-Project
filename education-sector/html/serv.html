<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تواصل معنا</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../style/vars.css" />
    <link rel="stylesheet" href="../../style/main.css" />
    <link rel="stylesheet" href="../../style/common-elements.css" />
    <link rel="stylesheet" href="../../style/accessibility.css" />

    <link rel="icon" href="../../assets/ico.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Indie+Flower&family=Lalezar&family=Qahiri&family=UoqMunThenKhung&family=Quicksand:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Cairo", sans-serif;
      }
      .contact-form {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      body {
        background-color: #f8f9fa;
        font-family: "Cairo", sans-serif;
      }
      .hero-section {
        background: linear-gradient(to left, #1e90ff, #007bff);
        color: white;
        padding: 60px 20px;
        text-align: center;
        border-radius: 0 0 50px 50px;
      }
      .section-title {
        border-right: 5px solid #007bff;
        padding-right: 10px;
        font-weight: bold;
      }
      .card:hover {
        transform: translateY(-5px);
        transition: 0.3s;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <section id="ta3leeem_elasasy" class="hero-section">
      <div class="container">
        <h1 class="display-5">مرحبا بكم</h1>
      </div>
    </section>

    <div class="container my-5">
      <h2 class="text-center mb-4">تواصل معنا</h2>
      <div class="row justify-content-center">
        <div class="col-md-6 contact-form">
          <form>
            <div class="mb-3">
              <label class="form-label">الاسم الكامل</label>
              <input type="text" class="form-control" placeholder="ادخل اسمك" />
            </div>
            <div class="mb-3">
              <label class="form-label">البريد الإلكتروني</label>
              <input
                type="email"
                class="form-control"
                placeholder="name@example.com"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">الرسالة</label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="اكتب رسالتك هنا..."
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">إرسال</button>
          </form>
        </div>
      </div>

      <section class="bg-light py-4">
        <div class="container text-center">
          <p class="mb-2">للاستفسارات أو الشكاوى يرجى التواصل معنا على:</p>
          <p class="fw-bold">edu-qaliobia@moe.gov.eg</p>
        </div>
      </section>
    </div>
    <script src="../../script/languages.js"></script>
    <script src="../../script/theme.js"></script>
    <script src="../../script/accessibility.js"></script>
    <script src="../../script/commonElements.js"></script>
    <script src="../../script/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        loadNavbar("../../");
        loadFooter("../../");
      });
    </script>
  </body>
</html>
