<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>خريطة محافظة القليوبية</title>
    <link rel="stylesheet" href="../../style/vars.css" />
    <link rel="stylesheet" href="../../style/main.css" />
    <link rel="stylesheet" href="../../style/common-elements.css" />
    <link rel="stylesheet" href="../../style/accessibility.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" href="../../assets/ico.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Indie+Flower&family=Lalezar&family=Qahiri&family=UoqMunThenKhung&family=Quicksand:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.33/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.33/"></script>
    <script>
      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/FeatureLayer",
        "esri/widgets/Search",
      ], function (Map, MapView, FeatureLayer, Search) {
        // إنشاء الخريطة
        const map = new Map({
          basemap: "topo-vector",
        });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          center: [31.205, 30.41], // وسط القليوبية
          zoom: 9,
        });

        // إضافة حدود المحافظة من الرابط الجديد
        const qalyubiaLayer = new FeatureLayer({
          url: "https://services6.arcgis.com/bXdJLmySyjdmbvNP/arcgis/rest/services/Map/FeatureServer/0",
          renderer: {
            type: "simple",
            symbol: {
              type: "simple-fill",
              color: [0, 0, 255, 0.2], // أزرق شفاف
              outline: {
                color: [0, 0, 255],
                width: 2,
              },
            },
          },
        });

        map.add(qalyubiaLayer);

        // إضافة أداة البحث
        const searchWidget = new Search({
          view: view,
        });
        view.ui.add(searchWidget, "top-right");
      });
    </script>
  </head>
  <body>
    <div id="viewDiv"></div>
    <script src="../../script/languages.js"></script>
    <script src="../../script/theme.js"></script>
    <script src="../../script/accessibility.js"></script>
    <script src="../../script/commonElements.js"></script>
    <script src="../../script/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        loadNavbar("../../");
        loadFooter("../../");
      });
    </script>
  </body>
</html>
